<!doctype html>
<html>
<head><meta charset="utf-8"><title>Xenon BLE</title></head>
<body style="font-family:sans-serif;padding:16px">
<button id="c">Connect</button>
<button id="on">LED On</button>
<button id="off">LED Off</button>
<br><br>
<input id="m" placeholder="message (max 20 chars)">
<button id="s">Send</button>
<pre id="log" style="background:#eee;padding:8px;height:300px;overflow:auto"></pre>
<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      RX ='6e400002-b5a3-f393-e0a9-e50e24dcca9e',
      TX ='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let rx;
const logEl=document.getElementById('log');
const log=t=>{logEl.textContent+=t+'\n';logEl.scrollTop=logEl.scrollHeight;};

document.getElementById('c').onclick=async()=>{try{
  const dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
  dev.addEventListener('gattserverdisconnected',()=>{rx=null;log('Disconnected');});
  const svc=await (await dev.gatt.connect()).getPrimaryService(SVC);
  rx=await svc.getCharacteristic(RX);
  const tx=await svc.getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener('characteristicvaluechanged',
    e=>log('Xenon: '+new TextDecoder().decode(e.target.value)));
  log('Connected to '+dev.name);
}catch(e){log('Error: '+e)}};

async function sendText(t){
  if(!rx) return log('Not connected');
  try{
    await rx.writeValueWithoutResponse(new TextEncoder().encode(t.slice(0,20)));
    log('Me: '+t);
  }catch(e){log('Error: '+e)}
}

document.getElementById('s').onclick=()=>{const m=document.getElementById('m');sendText(m.value);m.value='';};
document.getElementById('on').onclick=()=>sendText('on');
document.getElementById('off').onclick=()=>sendText('off');
</script>
</body>
</html>
